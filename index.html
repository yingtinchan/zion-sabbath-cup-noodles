<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>杯麵預訂與統計管理系統</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
</head>
<body>

  <!-- 頂部身分狀態列 -->
  <div class="user-status" id="userStatusBar">
    <span id="userStatusText">載入中…</span>
    <div id="gisButtonBox"></div>
    <button id="btnLogout" class="auth-btn" onclick="logoutUser()" style="display:none;">登出</button>
  </div>

  <!-- 導覽分頁 -->
  <div class="nav-tabs" id="navTabs">
    <div class="tab-btn active" data-tab="tab1" id="tab1Btn">報名</div>
    <div class="tab-btn" data-tab="tab2" id="tab2Btn">報名數目</div>
    <div class="tab-btn" data-tab="tab3" id="tab3Btn">統計數目</div>
  </div>

  <!-- 控制列 -->
  <div class="control-bar">
    <div class="control-left">
      <div class="select-group">
        <label>月份：</label>
        <select id="sheetSelect" onchange="onSheetOrWeekChange()" style="display:none;"></select>
        <span id="sheetText" class="fixed-badge">載入中...</span>
      </div>
      <div class="select-group">
        <label>週次：</label>
        <select id="weekSelect" onchange="onSheetOrWeekChange()" style="display:none;">
          <option value="1">第 1 週</option>
          <option value="2">第 2 週</option>
          <option value="3">第 3 週</option>
          <option value="4">第 4 週</option>
          <option value="5">第 5 週</option>
          <option value="6">第 6 週</option>
        </select>
        <span id="weekText" class="fixed-badge">載入中...</span>
      </div>
    </div>
    <div class="control-right" id="pageSizeContainer">
      <label>每頁：</label>
      <select id="pageSizeSelect" onchange="onPageSizeChange()">
        <option value="6">6 個</option>
        <option value="12" selected>12 個</option>
        <option value="24">24 個</option>
        <option value="36">36 個</option>
      </select>
    </div>
  </div>

  <!-- TAB 1: 報名 -->
  <div class="tab-content active" id="tab1">
    <div style="margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
      <span style="font-size: 13px; font-weight: bold; color: #2e7d32;" id="tab1SubTitle">現貨總數：計算中...</span>
      <label style="font-size: 13px; font-weight: 500; cursor: pointer;">
        <input type="checkbox" id="onlyStockCheckbox" onchange="onFilterChange()" checked> 僅看有現貨
      </label>
    </div>
    <div class="grid-container" id="gridContainer">載入商品中...</div>
    <div class="pagination-bar" id="paginationBar">
      <button id="prevBtn" onclick="changePage(-1)">上一頁</button>
      <span class="page-info" id="pageInfo">第 1 / 1 頁</span>
      <button id="nextBtn" onclick="changePage(1)">下一頁</button>
    </div>
  </div>

  <!-- TAB 1 底部購物車 -->
  <div class="fixed-footer" id="tab1Footer">
    <div class="footer-total" id="footerTotal">已選：0 杯</div>
    <button class="btn-submit" id="btnOpenDrawer">明細與報名</button>
  </div>
  <div class="drawer" id="cartDrawer">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <h4 style="font-size: 14px;">已選預訂清單</h4>
      <span style="font-size: 13px; color: #888; cursor: pointer;" onclick="closeDrawer()">✕ 關閉</span>
    </div>
    <div id="drawerList"></div>
    <button class="btn-submit" style="width: 100%; margin-top: 14px; border-radius: 8px;" onclick="confirmOrder()">確認提交報名</button>
  </div>

  <!-- TAB 2: 報名數目 -->
  <div class="tab-content" id="tab2">
    <div style="display: flex; gap: 8px; margin-bottom: 10px;">
      <select id="viewTypeDropdown" onchange="loadTab2Data()">
        <option value="week">每週記錄</option>
        <option value="month">當月累計總額</option>
      </select>
    </div>
    <table class="report-table">
      <thead>
        <tr>
          <th>產品名稱</th>
          <th>上週剩餘</th>
          <th id="thRegHeader">本週報名</th>
          <th>現時剩餘</th>
        </tr>
      </thead>
      <tbody id="tab2Body"><tr><td colspan="4" style="padding:20px; color:#888;">載入中...</td></tr></tbody>
      <tfoot id="tab2Foot"></tfoot>
    </table>
  </div>

  <!-- TAB 3: 統計數目與條碼盤點 -->
  <div class="tab-content" id="tab3">
    <div class="barcode-input-panel">
      <input type="text" id="manualBarcodeInput" placeholder="輸入條碼 (如 89686180657)..." />
      <button onclick="handleManualBarcodeClick()">輸入剩餘總數</button>
    </div>
    <div id="scannerWrapper">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <span style="font-weight: bold; font-size: 13px;" id="scannerStatusText">微距對焦掃描中...</span>
        <button style="padding: 4px 8px; border: 1px solid #ccc; background:#fff; border-radius:4px; cursor:pointer;" onclick="stopScanner()">✕ 關閉相機</button>
      </div>
      <video id="readerVideo" autoplay playsinline muted></video>
      <div id="reader"></div>
    </div>
    <div style="font-weight: bold; font-size: 13px; margin-bottom: 8px;">庫存盤點 (上次/最近剩餘 vs 最新剩餘)</div>
    <table class="report-table" style="margin-bottom: 80px;">
      <thead>
        <tr>
          <th>產品名稱</th>
          <th>上次/最近剩餘</th>
          <th>最新剩餘 (點擊修改)</th>
        </tr>
      </thead>
      <tbody id="tab3Body"><tr><td colspan="3" style="padding:20px; color:#888;">載入中...</td></tr></tbody>
      <tfoot id="tab3Foot"></tfoot>
    </table>
    <div class="fixed-footer" style="justify-content: center;">
      <button class="btn-submit" id="btnScanCode" onclick="startScanner()">📷 微距掃描條碼 Scan Code</button>
    </div>
  </div>

  <!-- 彈窗組件 -->
  <div class="modal-overlay" id="scanModal">
    <div class="modal-box">
      <img id="scanModalImg" src="" alt="杯麵圖片">
      <h4 id="scanModalName" style="font-size: 15px; margin-bottom: 4px;"></h4>
      <p id="scanModalBarcode" style="color: #666; font-size: 12px; margin-bottom: 12px;"></p>
      <p style="font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px;">調整剩餘總數：</p>
      <div class="stepper-modal">
        <button onclick="adjustScanQty(-1)">-</button>
        <input type="number" id="scanModalQtyInput" value="0" min="0">
        <button onclick="adjustScanQty(1)">+</button>
      </div>
      <p style="font-size: 11px; color: #888;">確認後將直接更新試算表剩餘總數並生成條碼圖</p>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal('scanModal')">取消</button>
        <button class="btn-confirm" id="btnConfirmScan" onclick="confirmScanStock()">確認設定</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <img id="editModalImg" src="" alt="杯麵圖片" style="width:90px; height:90px; object-fit:contain; margin-bottom:6px;">
      <h4 id="editModalProdTitle" style="font-size: 15px; margin-bottom: 6px;"></h4>
      <p id="editModalDesc" style="font-size: 13px; color: #555; margin-bottom: 12px;"></p>
      <p style="font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px;">調整剩餘總數：</p>
      <div class="stepper-modal">
        <button onclick="adjustEditVal(-1)">-</button>
        <input type="number" id="editNewValInput" min="0" value="0">
        <button onclick="adjustEditVal(1)">+</button>
      </div>
      <p style="font-size: 11px; color: #d32f2f;">⚠️ 將直接寫入試算表本週最新剩餘並留存記錄</p>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal('editModal')">取消</button>
        <button class="btn-confirm" onclick="executeSystemEdit()">確認修改</button>
      </div>
    </div>
  </div>

  <!-- 商品詳情 POPUP (點擊品名展示) -->
  <div class="modal-overlay" id="prodDetailModal">
    <div class="modal-box">
      <img id="detailModalImg" src="" alt="商品圖片" style="width:120px; height:120px; object-fit:contain; margin-bottom:8px;">
      <h4 id="detailModalName" style="font-size: 16px; margin-bottom: 8px;"></h4>
      <div style="background:#f8f9fa; padding:10px; border-radius:8px; font-size:13px; text-align:left; line-height:1.7;">
        <div><b>類別：</b><span id="detailModalCategory">-</span></div>
        <div><b>產地：</b><span id="detailModalOrigin">-</span></div>
        <div><b>國際條碼：</b><span id="detailModalBarcode" style="font-family:monospace; font-weight:bold; color:#1565c0;">-</span></div>
      </div>
      <div class="modal-actions">
        <button class="btn-confirm" onclick="closeModal('prodDetailModal')" style="width:100%;">關閉</button>
      </div>
    </div>
  </div>

  <!-- 系統提示模態框 -->
  <div class="modal-overlay" id="appDialogModal">
    <div class="modal-box">
      <h4 id="appDialogTitle" style="font-size: 16px; margin-bottom: 10px; color: #222;"></h4>
      <p id="appDialogMsg" style="font-size: 14px; color: #555; line-height: 1.6; margin-bottom: 8px;"></p>
      <div class="modal-actions" id="appDialogActions"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
