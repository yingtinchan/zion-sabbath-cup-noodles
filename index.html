<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>杯麵預訂與統計管理系統</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f5f6f8;
    }

    /* 裁切容器：向上推移 42px，將 Google Apps Script 頂部橫幅推移至螢幕可視區外 */
    #appWrapper {
      position: absolute;
      top: -42px;
      left: 0;
      width: 100%;
      height: calc(100% + 42px);
      overflow: hidden;
    }

    iframe {
      border: none;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <!-- 嵌入你的 Google Apps Script Web App 網址 -->
  <div id="appWrapper">
    <iframe
      src="https://script.google.com/macros/s/AKfycbx3Cyv9gbwwNjaAZyzmTMPWP9wsGJbL_v35-dkT4ePuLE9QRainNPhEGnSI76SN_T84/exec"
      allow="camera; microphone; clipboard-write; autoplay"
      allowfullscreen>
    </iframe>
  </div>
</body>
</html>
